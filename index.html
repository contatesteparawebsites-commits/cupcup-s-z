<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Corredor Liminal</title>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%}body{margin:0;overflow:hidden;background:#000;font-family:monospace;color:#fff}canvas{display:block}#info{position:absolute;top:12px;left:12px;z-index:10;padding:9px 12px;border-radius:8px;background:rgba(0,0,0,.5);color:#ddd;pointer-events:none}#start{position:absolute;inset:0;z-index:30;display:grid;place-items:center;background:radial-gradient(circle at center,rgba(60,70,80,.14),rgba(0,0,0,.94));cursor:pointer}#start span{padding:18px 28px;border:1px solid rgba(255,255,255,.24);border-radius:12px;background:rgba(0,0,0,.62);box-shadow:0 16px 50px rgba(0,0,0,.35);text-align:center;line-height:1.7;backdrop-filter:blur(7px)}#doorPrompt{position:absolute;left:50%;bottom:10%;transform:translateX(-50%);z-index:12;padding:12px 18px;border-radius:9px;background:rgba(0,0,0,.68);opacity:0;pointer-events:none;text-align:center;transition:opacity .18s;line-height:1.5}#view{position:fixed;inset:0;z-index:100;background:#000;visibility:hidden;opacity:0;transition:opacity .65s ease;display:grid;place-items:center}#view.show{visibility:visible;opacity:1}#viewImg{width:100%;height:100%;object-fit:cover;display:block}#viewFx{position:absolute;inset:0;pointer-events:none;opacity:0;mix-blend-mode:screen;background:repeating-linear-gradient(0deg,rgba(255,255,255,.07) 0 1px,transparent 1px 3px)}#view.weird #viewFx{opacity:.42;animation:shake .18s steps(2,end) infinite}#view.extreme #viewFx{opacity:.78;animation:shake .08s steps(2,end) infinite}#view.extreme #viewImg{filter:saturate(2.2) contrast(1.28) hue-rotate(10deg)}#close{position:absolute;right:26px;bottom:26px;z-index:3;padding:12px 18px;border:1px solid rgba(255,255,255,.35);border-radius:8px;background:rgba(0,0,0,.65);color:#fff;font:inherit;cursor:pointer;backdrop-filter:blur(7px)}#label{position:absolute;left:26px;bottom:26px;z-index:3;padding:10px 13px;border-radius:8px;background:rgba(0,0,0,.5)}@keyframes shake{0%{transform:translate(0,0)}25%{transform:translate(-2px,1px)}50%{transform:translate(2px,-1px)}75%{transform:translate(-1px,-2px)}100%{transform:translate(1px,1px)}}
</style>
</head>
<body>
<div id="info">WASD mover | mouse olhar | E abrir porta | ESC voltar</div>
<div id="start"><span>Clique para entrar<br>WASD + mouse</span></div>
<div id="doorPrompt"></div>
<div id="view"><img id="viewImg" alt="Espaço liminal"><div id="viewFx"></div><div id="label"></div><button id="close">Voltar</button></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x0a0a0a);
scene.fog=new THREE.Fog(0x0a0a0a,10,82);
const camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.1,200);
camera.position.set(0,1.7,34.5);
camera.rotation.order='YXZ';
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
document.body.appendChild(renderer.domElement);
scene.add(new THREE.AmbientLight(0x334455,.8));
scene.add(new THREE.HemisphereLight(0x8899aa,0x112233,.65));
function texture(w,h,draw){const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');draw(x,w,h);const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;return t}
const carpetTex=texture(256,256,(x,w,h)=>{x.fillStyle='#3a4a5a';x.fillRect(0,0,w,h);for(let i=0;i<2000;i++){x.fillStyle=`rgba(0,0,0,${Math.random()*.15})`;x.fillRect(Math.random()*w,Math.random()*h,2,2)}});carpetTex.repeat.set(8,8);
const wallTex=texture(256,256,(x,w,h)=>{x.fillStyle='#b8b09a';x.fillRect(0,0,w,h);for(let i=0;i<400;i++){x.fillStyle=`rgba(90,80,60,${Math.random()*.1})`;x.fillRect(Math.random()*w,Math.random()*h,1,1)}x.fillStyle='rgba(0,0,0,.2)';x.fillRect(0,0,w,4)});wallTex.repeat.set(4,2);
const ceilingTex=texture(128,128,(x,w,h)=>{x.fillStyle='#d8d8d0';x.fillRect(0,0,w,h);for(let i=0;i<200;i++){x.fillStyle=`rgba(0,0,0,${Math.random()*.05})`;x.fillRect(Math.random()*w,Math.random()*h,1,1)}});ceilingTex.repeat.set(6,6);
const carpet=new THREE.MeshStandardMaterial({map:carpetTex,roughness:.9});
const wall=new THREE.MeshStandardMaterial({map:wallTex,roughness:.85});
const ceiling=new THREE.MeshStandardMaterial({map:ceilingTex,roughness:.9});
const doorMat=new THREE.MeshStandardMaterial({color:0x2a2a2a,roughness:.6,metalness:.1});
const frameMat=new THREE.MeshStandardMaterial({color:0x555544,roughness:.5});
const lightMat=new THREE.MeshStandardMaterial({color:0xfff2cc,emissive:0xffffcc,emissiveIntensity:1.5});
const corridorLength=80,corridorWidth=4,wallH=4,wallT=.3;
function box(w,h,d,mat,x,y,z){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);scene.add(m);return m}
const floor=new THREE.Mesh(new THREE.PlaneGeometry(100,100),carpet);floor.rotation.x=-Math.PI/2;scene.add(floor);
const ceil=new THREE.Mesh(new THREE.PlaneGeometry(100,100),ceiling);ceil.rotation.x=Math.PI/2;ceil.position.y=wallH;scene.add(ceil);
box(wallT,wallH,corridorLength,wall,-corridorWidth/2-wallT/2,wallH/2,0);
box(wallT,wallH,corridorLength,wall,corridorWidth/2+wallT/2,wallH/2,0);
box(corridorWidth+wallT*2,wallH,wallT,wall,0,wallH/2,-corridorLength/2);
box(corridorWidth+wallT*2,wallH,wallT,wall,0,wallH/2,corridorLength/2);
const doors=[];const doorW=1.2,doorH=2.4;
function addDoor(side,index,z){const g=new THREE.Group();g.position.set(side==='left'?-corridorWidth/2+.05:corridorWidth/2-.05,0,z);const pivotZ=side==='left'?-doorW/2:doorW/2;const p=new THREE.Group();p.position.z=pivotZ;g.add(p);const d=new THREE.Mesh(new THREE.BoxGeometry(.05,doorH,doorW),doorMat);d.position.set(0,doorH/2,-pivotZ);p.add(d);const f=new THREE.Mesh(new THREE.BoxGeometry(wallT+.1,doorH+.2,doorW+.2),frameMat);f.position.set(side==='left'?-.08:.08,doorH/2,0);g.add(f);scene.add(g);const item={index,side,z,g,p,d,open:false,animating:false};d.userData.ref=item;doors.push(item)}
let n=1;for(let z=-35;z<=29;z+=8){addDoor('left',n++,z);addDoor('right',n++,z)}
for(let z=-38;z<=38;z+=4){const l=new THREE.Mesh(new THREE.BoxGeometry(.5,.1,1.2),lightMat);l.position.set(0,wallH-.05,z);scene.add(l);const p=new THREE.PointLight(0xfff0cc,.7,12,2);p.position.set(0,wallH-.5,z);scene.add(p)}
const fileNames=[
'Empty_bedroom_(4103505582).jpg','Sunset_at_playground.jpg','Abandoned_Pool.jpg','Empty_Hotel_Lobby_(50216817267).jpg','Empty_office.jpg','Empty_mall_amid_COVID19_lockdown.jpg','Quiet_Before_the_Lesson.jpg','Empty_hallway_in_Blakney_Building.jpg','Empty_subway_in_NYC.jpg','Empty_Subway_Train_Toronto_(Unsplash).jpg','Empty_corridor_(9286799582).jpg','Empty_hallway,_Katzen_Art_Museum.jpg','Abandoned_school_(15514290945).jpg','Empty_Mall_store_cincinnati.jpg','Empty_playground.jpg','Empty_Pool.jpg','Empty_Playground.jpg','Empty_corridor,_convention_center,_warehouse_district,_New_Orleans,_Louisiana,_USA.jpg'
];
const imagePaths=fileNames.map(n=>`https://commons.wikimedia.org/wiki/Special:Redirect/file/${encodeURIComponent(n)}`);
const fallback=['#f6c9d8','#d8c7f4','#b6e5f2','#f3d6c8','#e6e0b8','#9ccfd0','#d5b8eb','#91a8ba','#6ca6a8','#6d7f90','#66736f','#596873','#485963','#3d4c4a','#2d4842','#233437','#171f29','#090d12'];
const start=document.getElementById('start'),doorPrompt=document.getElementById('doorPrompt'),view=document.getElementById('view'),viewImg=document.getElementById('viewImg'),label=document.getElementById('label'),close=document.getElementById('close');
let locked=false,viewing=false,yaw=Math.PI,pitch=0;const keys={};
start.addEventListener('click',()=>renderer.domElement.requestPointerLock());
document.addEventListener('pointerlockchange',()=>{locked=document.pointerLockElement===renderer.domElement;if(!viewing)start.style.display=locked?'none':'grid'});
document.addEventListener('mousemove',e=>{if(!locked||viewing)return;yaw-=e.movementX*.002;pitch-=e.movementY*.002;pitch=Math.max(-Math.PI/2+.1,Math.min(Math.PI/2-.1,pitch))});
document.addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='KeyE'&&!viewing){const d=nearest();if(d)openDoor(d)}if(e.code==='Escape'&&viewing)closeView()});
document.addEventListener('keyup',e=>keys[e.code]=false);
function nearest(){let out=null,dist=2.5;for(const d of doors){if(d.open||d.animating)continue;const dx=camera.position.x-d.g.position.x,dz=camera.position.z-d.g.position.z,dd=Math.hypot(dx,dz);if(dd<dist){dist=dd;out=d}}return out}
function promptDoor(){if(viewing){doorPrompt.style.opacity='0';return}const d=nearest();if(!d){doorPrompt.style.opacity='0';return}doorPrompt.innerHTML=`PORTA ${String(d.index).padStart(2,'0')}<br>Pressione E ou clique`;doorPrompt.style.opacity='1'}
function animateDoor(d,target,done){const a=d.p.rotation.y,t0=performance.now();function tick(t){const q=Math.min((t-t0)/560,1),e=q<.5?2*q*q:1-Math.pow(-2*q+2,2)/2;d.p.rotation.y=a+(target-a)*e;if(q<1)requestAnimationFrame(tick);else done()}requestAnimationFrame(tick)}
function openDoor(d){if(!d||d.open||d.animating||viewing)return;d.animating=true;animateDoor(d,(d.side==='left'?-1:1)*Math.PI*.72,()=>{d.open=true;d.animating=false;showDoor(d)})}
function showDoor(d){viewing=true;viewImg.src=imagePaths[d.index-1];viewImg.style.background=fallback[d.index-1];label.textContent=`PORTA ${String(d.index).padStart(2,'0')}`;view.classList.remove('weird','extreme');if(d.index>=10&&d.index<=15)view.classList.add('weird');if(d.index>=16)view.classList.add('extreme');view.classList.add('show');document.exitPointerLock();start.style.display='none'}
viewImg.addEventListener('error',()=>{const c=document.createElement('canvas');c.width=1600;c.height=900;const x=c.getContext('2d');const g=x.createLinearGradient(0,0,c.width,c.height);g.addColorStop(0,fallback[Math.max(0,doors.findIndex(d=>String(viewImg.src).includes(encodeURIComponent(fileNames[d.index-1]))))]||'#222');g.addColorStop(1,'#050505');x.fillStyle=g;x.fillRect(0,0,c.width,c.height);x.fillStyle='rgba(255,255,255,.08)';for(let i=0;i<9000;i++)x.fillRect(Math.random()*c.width,Math.random()*c.height,1,1);viewImg.src=c.toDataURL('image/jpeg',.8)});
function closeView(){viewing=false;view.classList.remove('show');setTimeout(()=>renderer.domElement.requestPointerLock(),500)}
close.addEventListener('click',closeView);
const raycaster=new THREE.Raycaster(),center=new THREE.Vector2(0,0);renderer.domElement.addEventListener('click',()=>{if(viewing)return;if(!locked){renderer.domElement.requestPointerLock();return}raycaster.setFromCamera(center,camera);const hit=raycaster.intersectObjects(doors.map(d=>d.d),false)[0];if(!hit)return;const d=hit.object.userData.ref;const dx=camera.position.x-d.g.position.x,dz=camera.position.z-d.g.position.z;if(Math.hypot(dx,dz)<=2.5)openDoor(d)});
const velocity=new THREE.Vector3(),clock=new THREE.Clock();
function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.1);if(locked&&!viewing){const f=(keys.KeyW?1:0)-(keys.KeyS?1:0),s=(keys.KeyD?1:0)-(keys.KeyA?1:0),sin=Math.sin(yaw),cos=Math.cos(yaw);velocity.x=s*cos-f*sin;velocity.z=-s*sin-f*cos;camera.position.addScaledVector(velocity,3*dt);camera.position.y=1.7;camera.position.x=Math.max(-1.5,Math.min(1.5,camera.position.x));camera.position.z=Math.max(-39.5,Math.min(39.5,camera.position.z));camera.rotation.set(pitch,yaw,0)}promptDoor();renderer.render(scene,camera)}
animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script>
</body>
</html>
