        // ==================== GAME LOOP ====================
        let lastTime = 0;

        function gameLoop(timestamp) {
            const dt = Math.min(0.05, (timestamp - lastTime) / 1000);
            lastTime = timestamp;
            game.time += dt;

            // Update
            if (game.state === 'menu') {
                // Menu update
            } else if (game.state === 'select') {
                // Select update
            } else if (game.state === 'playing') {
                updatePlaying(dt);
            } else if (game.state === 'levelcomplete') {
                updateLevelComplete(dt);
            } else if (game.state === 'gameover' || game.state === 'victory') {
                // No updates needed
            }

            // Render
            render();

            requestAnimationFrame(gameLoop);
        }

        function updatePlaying(dt) {
            game.player.update(dt);
            game.boss.update(dt);

            // Update bullets
            for (let i = game.bullets.length - 1; i >= 0; i--) {
                const b = game.bullets[i];
                b.x += b.vx;
                b.y += b.vy;
                if (b.x < -50 || b.x > W + 50 || b.y < -50 || b.y > H + 50) {
                    game.bullets.splice(i, 1);
                    continue;
                }
                // Check collision with boss
                if (game.boss && rectsOverlap({ x: b.x - b.w / 2, y: b.y - b.h / 2, w: b.w, h: b.h }, game.boss
                        .getHitbox())) {
                    game.boss.takeDamage(b.damage);
                    game.bullets.splice(i, 1);
                    for (let p = 0; p < 3; p++) {
                        game.particles.push({
                            x: b.x,
                            y: b.y,
                            vx: rand(-2, 2),
                            vy: rand(-2, 2),
                            life: 0.2,
                            maxLife: 0.2,
                            color: '#FFD700',
                            size: rand(2, 4)
                        });
                    }
                }
            }

            // Update enemy bullets
            for (let i = game.enemyBullets.length - 1; i >= 0; i--) {
                const b = game.enemyBullets[i];
                b.x += b.vx;
                b.y += b.vy;
                if (b.x < -60 || b.x > W + 60 || b.y < -60 || b.y > H + 60) {
                    game.enemyBullets.splice(i, 1);
                    continue;
                }
                // Check collision with player
                const ph = game.player.getHitbox();
                if (rectCircleCollide(ph.x, ph.y, ph.w, ph.h, b.x, b.y, Math.max(b.w, b.h) * 0.6)) {
                    if (game.player.invincible <= 0) {
                        game.player.health--;
                        game.player.invincible = 1.0;
                        AudioSys.hit();
                        game.shakeTimer = 0.4;
                        game.shakeIntensity = 8;
                        for (let p = 0; p < 15; p++) {
                            game.particles.push({
                                x: game.player.x,
                                y: game.player.y,
                                vx: rand(-5, 5),
                                vy: rand(-6, 0),
                                life: 0.5,
                                maxLife: 0.5,
                                color: '#FF0000',
                                size: rand(2, 5)
                            });
                        }
                        if (game.player.health <= 0) {
                            game.player.health = 0;
                            game.state = 'gameover';
                            AudioSys.lose();
                            AudioSys.stopMusic();
                        }
                    }
                    game.enemyBullets.splice(i, 1);
                }
            }

            // Update particles
            for (let i = game.particles.length - 1; i >= 0; i--) {
                const p = game.particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.3;
                p.life -= dt;
                if (p.life <= 0) game.particles.splice(i, 1);
            }

            // Update floating texts
            for (let i = game.floatingTexts.length - 1; i >= 0; i--) {
                const ft = game.floatingTexts[i];
                ft.y -= 1.5;
                ft.life -= dt;
                if (ft.life <= 0) game.floatingTexts.splice(i, 1);
            }

            // Shake
            if (game.shakeTimer > 0) game.shakeTimer -= dt;

            // Boss defeated transition
            if (game.bossDefeated) {
                game.levelTransitionTimer -= dt;
                if (game.levelTransitionTimer <= 0) {
                    game.bossDefeated = false;
                    game.totalScore += 1000 + game.boss.maxHealth * 50;
                    if (game.boss.index < game.bossesUnlocked && game.boss.index < 9) {
                        game.bossesUnlocked = game.boss.index + 2;
                    }
                    game.state = 'levelcomplete';
                    AudioSys.victory();
                    AudioSys.stopMusic();
                }
            }
        }

        function updateLevelComplete(dt) {
            // Wait for input
        }

        function render() {
            ctx.clearRect(0, 0, W, H);

            // Screen shake offset
            let shakeX = 0;
            let shakeY = 0;
            if (game.shakeTimer > 0) {
                shakeX = rand(-game.shakeIntensity, game.shakeIntensity) * (game.shakeTimer / 0.4);
                shakeY = rand(-game.shakeIntensity, game.shakeIntensity) * (game.shakeTimer / 0.4);
            }
            ctx.save();
            ctx.translate(shakeX, shakeY);

            if (game.state === 'menu') {
                drawMenu();
            } else if (game.state === 'select') {
                drawBossSelect();
            } else if (game.state === 'playing' || game.state === 'levelcomplete') {
                // Background
                ctx.fillStyle = '#e8d5b5';
                ctx.fillRect(0, 0, W, H);
                drawSepiaBackground();
                drawBattleBackground();

                // Draw boss
                if (game.boss) game.boss.draw(ctx);

                // Draw player
                if (game.player) game.player.draw(ctx);

                // Draw bullets
                for (const b of game.bullets) {
                    ctx.fillStyle = '#FFD700';
                    ctx.strokeStyle = '#3d1f0a';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.ellipse(b.x, b.y, b.w / 2, b.h / 2, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();
                    // Trail
                    ctx.fillStyle = 'rgba(255,200,50,0.3)';
                    ctx.beginPath();
                    ctx.arc(b.x - b.vx * 0.15, b.y, 3, 0, Math.PI * 2);
                    ctx.fill();
                }

                // Draw enemy bullets
                for (const b of game.enemyBullets) {
                    ctx.fillStyle = b.color || '#FF0000';
                    ctx.strokeStyle = '#3d1f0a';
                    ctx.lineWidth = 1.5;
                    if (b.type === 'steam') {
                        ctx.fillStyle = 'rgba(200,200,200,0.6)';
                        ctx.beginPath();
                        ctx.arc(b.x, b.y, b.w / 2, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.stroke();
                    } else if (b.type === 'balloon') {
                        ctx.fillStyle = b.color;
                        ctx.beginPath();
                        ctx.ellipse(b.x, b.y, b.w / 2, b.h / 2, 0, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.stroke();
                        // String
                        ctx.beginPath();
                        ctx.moveTo(b.x, b.y + b.h / 2);
                        ctx.lineTo(b.x + 2, b.y + b.h / 2 + 10);
                        ctx.stroke();
                    } else if (b.type === 'gear') {
                        ctx.fillStyle = b.color;
                        ctx.beginPath();
                        for (let i = 0; i < 8; i++) {
                            const a = (i / 8) * Math.PI * 2 + game.time * 3;
                            ctx.lineTo(b.x + Math.cos(a) * b.w / 2, b.y + Math.sin(a) * b.h / 2);
                        }
                        ctx.closePath();
                        ctx.fill();
                        ctx.stroke();
                    } else if (b.type === 'fire' || b.type === 'fireball') {
                        ctx.fillStyle = b.color;
                        ctx.beginPath();
                        ctx.arc(b.x, b.y, b.w / 2, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.stroke();
                        ctx.fillStyle = 'rgba(255,255,100,0.5)';
                        ctx.beginPath();
                        ctx.arc(b.x, b.y, b.w / 4, 0, Math.PI * 2);
                        ctx.fill();
                    } else {
                        ctx.beginPath();
                        ctx.ellipse(b.x, b.y, b.w / 2, b.h / 2, 0, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.stroke();
                    }
                }

                // Draw particles
                for (const p of game.particles) {
                    const alpha = p.life / p.maxLife;
                    ctx.globalAlpha = alpha;
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.globalAlpha = 1;
                }

                // Draw floating texts
                for (const ft of game.floatingTexts) {
                    const alpha = ft.life / ft.maxLife;
                    ctx.globalAlpha = alpha;
                    ctx.fillStyle = ft.color;
                    ctx.font = ft.size + 'px "Alfa Slab One", cursive';
                    ctx.textAlign = 'center';
                    ctx.fillText(ft.text, ft.x, ft.y);
                    ctx.textAlign = 'left';
                    ctx.globalAlpha = 1;
                }

                drawHUD();

                // Overlays
                if (game.state === 'levelcomplete') {
                    drawLevelComplete();
                }
                if (game.bossDefeated) {
                    // White flash
                    const flashAlpha = clamp(game.levelTransitionTimer / 2, 0, 1) * 0.7;
                    ctx.fillStyle = 'rgba(255,255,255,' + flashAlpha + ')';
                    ctx.fillRect(0, 0, W, H);
                }
            } else if (game.state === 'gameover') {
                drawGameOver();
            } else if (game.state === 'victory') {
                drawVictory();
            }

            ctx.restore();

            // Film grain overlay (not affected by shake)
            ctx.fillStyle = 'rgba(60,40,20,0.02)';
            for (let i = 0; i < 150; i++) {
                ctx.fillRect(Math.random() * W, Math.random() * H, 1.5, 1.5);
            }
        }

        function drawBattleBackground() {
            // Platform/ground pattern
            ctx.fillStyle = '#c4a882';
            ctx.fillRect(0, GROUND_Y, W, H - GROUND_Y);
            ctx.fillStyle = '#8b7355';
            ctx.fillRect(0, GROUND_Y, W, 3);
            ctx.fillStyle = '#9b8365';
            for (let i = 0; i < 20; i++) {
                ctx.fillRect(i * 50, GROUND_Y + 3, 25, 2);
            }
            // Columns in background
            for (let i = 0; i < 4; i++) {
                const cx = 120 + i * 250;
                ctx.fillStyle = 'rgba(139,115,85,0.3)';
                ctx.fillRect(cx - 20, 100, 40, GROUND_Y - 100);
                ctx.fillStyle = 'rgba(139,115,85,0.2)';
                ctx.fillRect(cx - 30, 80, 60, 20);
            }
            // Stars/decorations
            ctx.fillStyle = 'rgba(139,69,19,0.15)';
            for (let i = 0; i < 10; i++) {
                const sx = (i * 97) % W;
                const sy = 50 + (i * 53) % 150;
                ctx.beginPath();
                ctx.arc(sx, sy, 3 + Math.sin(game.time * 2 + i) * 1.5, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // ==================== GAME FLOW ====================
        function goToSelect() {
            game.state = 'select';
            game.currentBossIndex = 0;
            game.bossDefeated = false;
            game.levelTransitionTimer = 0;
            game.bullets = [];
            game.enemyBullets = [];
            game.particles = [];
            game.floatingTexts = [];
            game.totalScore = 0;
            game.bossesUnlocked = 1;
            AudioSys.init();
            AudioSys.startMusic();
        }

        function startBoss(index) {
            if (index >= BOSS_DEFS.length) return;
            if (index >= game.bossesUnlocked) return;
            game.state = 'playing';
            game.currentBossIndex = index;
            game.player = new Player();
            game.boss = new Boss(BOSS_DEFS[index]);
            game.bullets = [];
            game.enemyBullets = [];
            game.particles = [];
            game.floatingTexts = [];
            game.bossDefeated = false;
            game.levelTransitionTimer = 0;
            game.shakeTimer = 0;
            game.bossStartTime = game.time;
            AudioSys.init();
            AudioSys.startMusic();
        }

        // ==================== CLICK HANDLING ====================
        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const scaleX = W / rect.width;
            const scaleY = H / rect.height;
            const mx = (e.clientX - rect.left) * scaleX;
            const my = (e.clientY - rect.top) * scaleY;

            if (game.state === 'menu') {
                if (game.menuButtons) {
                    for (const btn of game.menuButtons) {
                        if (mx >= btn.x && mx <= btn.x + btn.w && my >= btn.y && my <= btn.y + btn.h) {
                            if (btn.action === 'play') {
                                AudioSys.init();
                                goToSelect();
                            }
                        }
                    }
                }
            }
            if (game.state === 'select') {
                // Click boss cards
                for (let i = 0; i < BOSS_DEFS.length; i++) {
                    const bx = 80 + (i % 5) * 170;
                    const by = 140 + Math.floor(i / 5) * 200;
                    if (mx >= bx - 65 && mx <= bx + 65 && my >= by - 60 && my <= by + 70) {
                        if (i < game.bossesUnlocked) {
                            game.currentBossIndex = i;
                            startBoss(i);
                        }
                    }
                }
            }
        });

        canvas.addEventListener('mousemove', (e) => {
            // Track hover for menu buttons
            const rect = canvas.getBoundingClientRect();
            const scaleX = W / rect.width;
            const scaleY = H / rect.height;
            const mx = (e.clientX - rect.left) * scaleX;
            const my = (e.clientY - rect.top) * scaleY;
            game.hoverX = mx;
            game.hoverY = my;
        });

        // ==================== POLYFILL ====================
        if (!CanvasRenderingContext2D.prototype.roundRect) {
            CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
                if (typeof r === 'number') r = { tl: r, tr: r, br: r, bl: r };
                this.beginPath();
                this.moveTo(x + r.tl, y);
                this.lineTo(x + w - r.tr, y);
                this.quadraticCurveTo(x + w, y, x + w, y + r.tr);
                this.lineTo(x + w, y + h - r.br);
                this.quadraticCurveTo(x + w, y + h, x + w - r.br, y + h);
                this.lineTo(x + r.bl, y + h);
                this.quadraticCurveTo(x, y + h, x, y + h - r.bl);
                this.lineTo(x, y + r.tl);
                this.quadraticCurveTo(x, y, x + r.tl, y);
                this.closePath();
                return this;
            };
        }

        // ==================== INIT ====================
        game.player = new Player();
        game.menuAnimTime = 0;
        game.menuButtons = [];
        lastTime = performance.now();
        requestAnimationFrame(gameLoop);

        // Keyboard shortcut to init audio on first interaction
        document.addEventListener('click', () => { AudioSys.init(); });
        document.addEventListener('keydown', () => { AudioSys.init(); });

        console.log('☕ CAFÉ AMARGO - Aventura do Sr. Xícara');
        console.log('🎮 Controles: ← → mover | ↑ pular | Z/Espaço atirar');
        console.log('🎵 Música original via Web Audio API');
        console.log('👾 10 chefes autorais!');
    </script>
</body>
